name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      deployment_host:
        description: "Base URL of the deployed mdshare instance (e.g. http://192.168.1.100:5000)"
        required: true
        type: string
      deployment_master_password:
        description: "Master password of the deployed mdshare instance"
        required: true
        type: string

jobs:
  integration:
    runs-on: docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: pip install httpx pytest

      - name: Run integration tests
        env:
          DEPLOYMENT_HOST: ${{ inputs.deployment_host }}
          DEPLOYMENT_MASTER_PASSWORD: ${{ inputs.deployment_master_password }}
        run: python -m pytest tests/integration/ -v -m integration --junitxml=test-results/junit.xml

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        with:
          name: integration-test-results
          path: test-results/
