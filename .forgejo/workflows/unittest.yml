name: Unit Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests (Docker)
        run: make ci-unit-test

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        with:
          name: test-results
          path: test-results/
