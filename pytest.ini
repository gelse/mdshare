[pytest]
testpaths = backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers

filterwarnings =
    error
    ignore::DeprecationWarning

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that require external services
