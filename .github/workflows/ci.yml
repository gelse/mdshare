# mdshare — unified CI workflow
#
# test job:  Runs on every push/PR (all branches)
# publish job: Runs only on release branch, only after test passes.
#             Builds, retags, and pushes the image to GHCR.
#
# The workflow uses job dependencies (needs: test) to guarantee
# only passing code is published.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests (Docker Compose)
        run: make ci-unit-test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests
          path: test-results/junit.xml
          reporter: java-junit

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (generic tags via Makefile)
        run: make docker-build

      - name: Retag and push to GHCR
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker tag gelse/mdshare:latest     ghcr.io/gelse/mdshare:latest
          docker tag gelse/mdshare:${SHORT_SHA} ghcr.io/gelse/mdshare:${SHORT_SHA}
          docker push ghcr.io/gelse/mdshare:latest
          docker push ghcr.io/gelse/mdshare:${SHORT_SHA}
