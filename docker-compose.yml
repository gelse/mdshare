services:
  mdshare:
    build:
      context: .
      args:
        MDSHARE_VERSION: ${MDSHARE_VERSION:-unknown}
    container_name: mdshare
    restart: unless-stopped
    # Remove ports mapping when running behind a reverse proxy (e.g. Traefik)
    ports:
      - "8080:5000"
    volumes:
      - mdshare_data:/data
    environment:
      - MDSHARE_DATA_DIR=/data
      - MDSHARE_MASTER_PASSWORD=change-me-to-a-secure-password
      - MDSHARE_MAX_SIZE=5242880
      # Uncomment and set when running behind a reverse proxy:
      # - MDSHARE_BASE_URL=https://mdshare.example.com
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/api/health').getcode() == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # CI/test service — only active when --profile test is passed.
  # Not started by plain "docker compose up".
  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        MDSHARE_VERSION: ${MDSHARE_VERSION:-unknown}
    volumes:
      - ./test-results:/app/test-results
    command: python -m pytest backend -v --junitxml=/app/test-results/junit.xml

volumes:
  mdshare_data:
